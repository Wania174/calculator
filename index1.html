<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        .calculator {
            width: 340px;
            padding: 20px;
            border-radius: 20px;
            background: #202124;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .display {
            width: 100%;
            height: 90px;
            margin-bottom: 18px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            outline: none;
            background: #303134;
            color: white;
            font-size: 2.2rem;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 12px;
            background: #3c4043;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            background: #505357;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #6c5ce7;
        }

        .operator:hover {
            background: #5848d6;
        }

        .clear {
            background: #d9534f;
        }

        .clear:hover {
            background: #c43f3b;
        }

        .delete {
            background: #e09f3e;
        }

        .delete:hover {
            background: #c98c32;
        }

        .equals {
            background: #28a745;
            grid-column: span 2;
        }

        .equals:hover {
            background: #218838;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <input type="text" id="display" class="display" value="0" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">
                AC
            </button>
            <button class="delete" onclick="deleteNumber()">
                DEL
            </button>
            <button onclick="percentage()">
                %
            </button>
            <button class="operator" onclick="chooseOperator('/')">
                /
            </button>
            <button onclick="addNumber('7')">
                7
            </button>
            <button onclick="addNumber('8')">
                8
            </button>
            <button onclick="addNumber('9')">
                9
            </button>
            <button class="operator" onclick="chooseOperator('*')">
                *
            </button>
            <button onclick="addNumber('4')">
                4
            </button>
            <button onclick="addNumber('5')">
                5
            </button>
            <button onclick="addNumber('6')">
                6
            </button>
            <button class="operator" onclick="chooseOperator('-')">
                -
            </button>
            <button onclick="addNumber('1')">
                1
            </button>
            <button onclick="addNumber('2')">
                2
            </button>
            <button onclick="addNumber('3')">
                3
            </button>
            <button class="operator" onclick="chooseOperator('+')">
                +
            </button>
            <button onclick="addNumber('0')">
                0
            </button>
            <button onclick="addDecimal()">
                .
            </button>
            <button class="equals" onclick="calculate()">
                =
            </button>
        </div>
    </div>
    <script>
        let display = document.getElementById("display");
        let firstNumber = null;
        let operator = null;
        let waitingForSecondNumber = false;
        // Add number
        function addNumber(number) {
            if (
                display.value === "0" ||
                waitingForSecondNumber
            ) {
                display.value = number;
                waitingForSecondNumber = false;
            } else {
                display.value += number;
            }
        }
        // Decimal
        function addDecimal() {
            if (waitingForSecondNumber) {
                display.value = "0.";
                waitingForSecondNumber = false;
                return;
            }
            if (!display.value.includes(".")) {
                display.value += ".";
            }
        }
        // Choose operator
        function chooseOperator(selectedOperator) {
            if (operator !== null && !waitingForSecondNumber) {
                calculate();
            }
            firstNumber = Number(display.value);
            operator = selectedOperator;
            waitingForSecondNumber = true;
        }
        // Calculate
        function calculate() {
            if (
                operator === null ||
                waitingForSecondNumber
            ) {
                return;
            }
            let secondNumber = Number(display.value);
            let result;
            if (operator === "+") {
                result = firstNumber + secondNumber;
            }
            else if (operator === "-") {
                result = firstNumber - secondNumber;
            }
            else if (operator === "*") {
                result = firstNumber * secondNumber;
            }
            else if (operator === "/") {
                if (secondNumber === 0) {
                    display.value = "Error";
                    firstNumber = null;
                    operator = null;
                    return;
                }
                result = firstNumber / secondNumber;
            }
            display.value = result;
            firstNumber = result;
            operator = null;
            waitingForSecondNumber = true;
        }
        // Clear
        function clearDisplay() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            waitingForSecondNumber = false;
        }
        // Delete
        function deleteNumber() {
            if (
                display.value.length === 1 ||
                display.value === "Error"
            ) {
                display.value = "0";
            } else {
                display.value =
                    display.value.slice(0, -1);
            }
        }
        // Percentage
        function percentage() {
            let number = Number(display.value);
            display.value = number / 100;
        }
        // Keyboard support
        document.addEventListener(
            "keydown",
            function (event) {
                if (
                    event.key >= "0" &&
                    event.key <= "9"
                ) {
                    addNumber(event.key);
                }
                else if (event.key === ".") {
                    addDecimal();
                }
                else if (
                    event.key === "+" ||
                    event.key === "-" ||
                    event.key === "*" ||
                    event.key === "/"
                ) {
                    chooseOperator(event.key);
                }
                else if (event.key === "Enter" || event.key === "=") {
                    calculate();
                }
                else if (event.key === "Backspace") {
                    deleteNumber();
                }
                else if (event.key === "Escape") {
                    clearDisplay();
                }
            }
        );
    </script>
</body>

</html>
